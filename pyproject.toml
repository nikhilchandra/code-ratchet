[project]
name = "code-ratchet"
version = "0.1.0"
description = "Audit a Python project's design, then fix it one small, tested step at a time with Claude agents."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "agent-rooster",
    "pydantic>=2",
]

[project.scripts]
ratchet = "ratchet.cli:main"

[tool.uv.sources]
agent-rooster = { path = "../agent-rooster", editable = true }

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.pytest.ini_options]
# the live tests call the claude CLI and spend tokens, so they run only when asked for with -m live
addopts = "-m 'not live'"
markers = [
    "live: calls the claude CLI for real and spends tokens against your plan",
]
