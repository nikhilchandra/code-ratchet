[project]
name = "ratchet-rooster"
version = "0.1.0"
description = "Hands a coding goal to a team of agents that work in small, tested, committed steps."
requires-python = ">=3.11"
dependencies = [
    "agent-rooster",
    "pydantic>=2",
]

[tool.uv.sources]
agent-rooster = { path = "../agent-rooster", editable = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ratchet"]

[tool.pytest.ini_options]
markers = [
    "live: calls the claude CLI for real and spends tokens against your plan",
]
